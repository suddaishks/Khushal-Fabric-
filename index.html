<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushal Fabric - Official Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #d81b60 !important; }

        #cart-popup {
            display: none; position: fixed; top: 80px; right: 20px; z-index: 9999;
            background: #25d366; color: white; padding: 12px 25px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: 600;
        }

        .filter-container { background: white; padding: 15px; text-align: center; position: sticky; top: 60px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; white-space: nowrap; }
        .filter-btn { border: 2px solid #d81b60; background: transparent; color: #d81b60; padding: 5px 15px; margin: 3px; border-radius: 30px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .filter-btn.active { background: #d81b60; color: white; }

        .brand-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: none; height: 100%; transition: 0.3s; position: relative; }
        .carousel-item img { height: 260px; object-fit: cover; width: 100%; cursor: zoom-in; }
        
        .pdf-badge { position: absolute; top: 10px; left: 10px; background: rgba(216, 27, 96, 0.9); color: white; padding: 3px 10px; border-radius: 15px; font-size: 10px; z-index: 10; text-decoration: none; font-weight: bold; }

        .price-tag { color: #d81b60; font-size: 1.1rem; font-weight: bold; }
        .brand-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; color: #333; }

        #cartPanel { display:none; position:fixed; right:0; top:0; height:100%; width:380px; background: white; z-index: 3000; box-shadow: -5px 0 30px rgba(0,0,0,0.2); padding: 25px; overflow-y:auto; }
        .qty-control { display: flex; align-items: center; border: 1px solid #eee; border-radius: 5px; overflow: hidden; }
        .qty-btn { width: 30px; height: 30px; background: #f8f9fa; border: none; font-weight: bold; }
        
        .whatsapp-btn { position: fixed; bottom: 30px; left: 20px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        /* Zoom Image Modal Style */
        #imgModal .modal-content { background: transparent; border: none; }
        #imgModal img { border-radius: 10px; width: 100%; height: auto; }

        @media (max-width: 576px) { 
            #cartPanel { width: 100%; } 
            .col-6 { padding: 4px; }
            .carousel-item img { height: 220px; }
        }
    </style>
</head>
<body>

<div id="cart-popup"><i class="fa fa-check-circle me-2"></i> Added to Bag!</div>

<div class="modal fade" id="imgModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-0 text-center">
                <img src="" id="fullImg">
                <button type="button" class="btn btn-light mt-3" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<nav class="navbar navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand">KHUSHAL FABRIC</a>
        <div class="ms-auto">
            <a class="nav-link position-relative" href="javascript:void(0)" onclick="toggleCart()">
                <i class="fa fa-shopping-bag fs-4"></i>
                <span id="cart-count" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="filter-container">
    <button class="filter-btn active" onclick="filterBrands('all', this)">All</button>
    <button class="filter-btn" onclick="filterBrands('lawn', this)">Lawn Trouser</button>
    <button class="filter-btn" onclick="filterBrands('mizaj', this)">Mizaj</button>
    <button class="filter-btn" onclick="filterBrands('jacquard', this)">Jacquard</button>
    <button class="filter-btn" onclick="filterBrands('binsaeed', this)">Bin Saeed</button>
    <button class="filter-btn" onclick="filterBrands('alkaram', this)">Alkaram</button>
    <button class="filter-btn" onclick="filterBrands('mtj', this)">MTJ</button>
    <button class="filter-btn" onclick="filterBrands('jdot', this)">J.</button>
    <button class="filter-btn" onclick="filterBrands('saya', this)">Saya</button>
</div>

<div class="container-fluid px-3 my-4">
    <div class="row g-2 g-md-4" id="brandGrid">
        
        <div class="col-6 col-md-4 col-lg-3 brand-item lawn">
            <div class="brand-card">
                <div id="slideLawn" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active"><img src="lawn1.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="lawn2.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="lawn3.jpg" onclick="zoomImg(this)"></div>
                    </div>
                </div>
                <div class="p-2 text-center">
                    <h6 class="brand-name">Lawn Trouser</h6>
                    <div class="price-tag mb-2">Rs. 1200</div>
                    <input type="text" id="in-lawn" class="form-control form-control-sm mb-1" placeholder="Color/Size">
                    <button class="btn btn-success btn-sm w-100" onclick="addItem('Lawn Trouser', 1200, 'in-lawn')">Add to Bag</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 brand-item mizaj">
            <div class="brand-card">
                <div id="slideMizaj" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active"><img src="mizaj1.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="mizaj2.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="mizaj3.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="mizaj4.jpg" onclick="zoomImg(this)"></div>
                        </div>
                </div>
                <div class="p-2 text-center">
                    <h6 class="brand-name">Mizaj Shirt</h6>
                    <div class="price-tag mb-2">Rs. 1850</div>
                    <input type="text" id="in-mizaj" class="form-control form-control-sm mb-1" placeholder="Design">
                    <button class="btn btn-success btn-sm w-100" onclick="addItem('Mizaj', 1850, 'in-mizaj')">Add to Bag</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 brand-item binsaeed">
            <div class="brand-card">
                <a href="binsaeed.pdf" target="_blank" class="pdf-badge">PDF</a>
                <div id="slideBS" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active"><img src="bs1.jpg" onclick="zoomImg(this)"></div>
                        <div class="carousel-item"><img src="bs2.jpg" onclick="zoomImg(this)"></div>
                    </div>
                </div>
                <div class="p-2 text-center">
                    <h6 class="brand-name">Bin Saeed</h6>
                    <div class="price-tag mb-2">Rs. 2600</div>
                    <input type="text" id="in-bs" class="form-control form-control-sm mb-1" placeholder="Design No.">
                    <button class="btn btn-success btn-sm w-100" onclick="addItem('Bin Saeed', 2600, 'in-bs')">Add to Bag</button>
                </div>
            </div>
        </div>

        </div>
</div>

<div id="cartPanel">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Shopping Bag</h4>
        <button class="btn-close" onclick="toggleCart()"></button>
    </div>
    <div id="cartList"></div>
    <div id="empty-msg" class="text-center py-5 text-muted">
        <i class="fa fa-shopping-basket fa-3x mb-3"></i>
        <p>Your Bag is empty!</p>
    </div>
    <div id="cart-footer" style="display:none;">
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
            <span>Total:</span><span>Rs. <span id="totalPrice">0</span></span>
        </div>
        <div class="bg-light p-3 rounded mb-3">
            <input type="text" id="custName" class="form-control mb-2" placeholder="Full Name">
            <textarea id="custAddr" class="form-control" placeholder="Complete Address"></textarea>
        </div>
        <button class="btn btn-success w-100 py-3 fw-bold shadow" onclick="sendWhatsApp()">CONFIRM ON WHATSAPP</button>
    </div>
</div>

<footer class="bg-dark text-white pt-5 pb-3">
    <div class="container text-center">
        <h6 class="fw-bold mb-3">KHUSHAL FABRIC</h6>
        <p class="small text-secondary mb-1">03490162829 | alKaram kapra gali Zam Zam Market, Karachi</p>
        <div class="fs-4 py-2"><i class="fab fa-facebook mx-2"></i><i class="fab fa-instagram mx-2"></i></div>
        <hr class="bg-secondary">
        <p class="small text-secondary">&copy; 2026 Khushal Fabric.</p>
    </div>
</footer>

<a href="https://wa.me/923490162829" class="whatsapp-btn"><i class="fab fa-whatsapp"></i></a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let cart = [];

    // Image Zoom Function
    function zoomImg(el) {
        document.getElementById('fullImg').src = el.src;
        var myModal = new bootstrap.Modal(document.getElementById('imgModal'));
        myModal.show();
    }

    function filterBrands(cat, btn) {
        document.querySelectorAll('.brand-item').forEach(i => i.style.display = (cat === 'all' || i.classList.contains(cat)) ? 'block' : 'none');
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addItem(name, price, inputId) {
        let detail = document.getElementById(inputId).value;
        if(!detail) { alert("Please enter color/design!"); return; }
        let fullTitle = name + " (" + detail + ")";
        let exists = cart.find(i => i.title === fullTitle);
        if(exists) { exists.qty++; } 
        else { cart.push({ title: fullTitle, price: price, qty: 1 }); }
        document.getElementById(inputId).value = '';
        showPopup();
        updateUI();
    }

    function showPopup() {
        let p = document.getElementById('cart-popup');
        p.style.display = 'block';
        setTimeout(() => p.style.display = 'none', 2000);
    }

    function updateUI() {
        const list = document.getElementById('cartList');
        const footer = document.getElementById('cart-footer');
        const empty = document.getElementById('empty-msg');
        let total = 0, count = 0;
        list.innerHTML = "";
        if(cart.length === 0) {
            empty.style.display = "block"; footer.style.display = "none";
        } else {
            empty.style.display = "none"; footer.style.display = "block";
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                count += item.qty;
                list.innerHTML += `<div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <div style="width: 60%;"><div class="fw-bold small">${item.title}</div><div class="text-danger small">Rs. ${item.price * item.qty}</div></div>
                    <div class="qty-control"><button class="qty-btn" onclick="updateQty(${index},-1)">-</button><span class="mx-2 small">${item.qty}</span><button class="qty-btn" onclick="updateQty(${index},1)">+</button></div>
                </div>`;
            });
        }
        document.getElementById('totalPrice').innerText = total;
        document.getElementById('cart-count').innerText = count;
    }

    function updateQty(index, amt) {
        cart[index].qty += amt;
        if(cart[index].qty <= 0) cart.splice(index, 1);
        updateUI();
    }

    function toggleCart() {
        let p = document.getElementById('cartPanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    function sendWhatsApp() {
        let n = document.getElementById('custName').value, a = document.getElementById('custAddr').value;
        if(!n || !a) { alert("Fill name and address!"); return; }
        let msg = `*Order: Khushal Fabric*%0AName: ${n}%0AAddress: ${a}%0A%0AItems:%0A`;
        cart.forEach(i => msg += `- ${i.title} (x${i.qty}) : Rs.${i.price*i.qty}%0A`);
        msg += `%0A*Total: Rs. ${document.getElementById('totalPrice').innerText}*`;
        window.open(`https://wa.me/923490162829?text=${msg}`);
    }
</script>

</body>
</html>
