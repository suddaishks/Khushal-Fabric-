<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushal Fabric - Premium Slider Collection</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f4f4; }
        .navbar-brand { font-weight: bold; color: #d81b60 !important; }
        
        /* Filter Styling */
        .filter-container { background: white; padding: 15px; text-align: center; sticky-top: 60px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; white-space: nowrap; }
        .filter-btn { border: 2px solid #d81b60; background: transparent; color: #d81b60; padding: 5px 20px; margin: 5px; border-radius: 30px; font-weight: 600; font-size: 14px; }
        .filter-btn.active { background: #d81b60; color: white; }

        /* Card & Slider Styling */
        .brand-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: none; height: 100%; transition: 0.3s; }
        .brand-card:hover { transform: translateY(-5px); }
        .carousel-item img { height: 400px; object-fit: cover; width: 100%; }
        
        .pdf-link { position: absolute; top: 15px; left: 15px; background: rgba(216, 27, 96, 0.9); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; z-index: 10; text-decoration: none; font-weight: bold; }
        
        .card-body { padding: 20px; text-align: center; }
        .price-tag { color: #d81b60; font-size: 1.3rem; font-weight: bold; }
        .old-price { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-right: 8px; }

        /* Cart Panel */
        #cartPanel { display:none; position:fixed; right:0; top:0; height:100%; width:380px; background: white; z-index: 2000; box-shadow: -5px 0 30px rgba(0,0,0,0.2); padding: 25px; overflow-y:auto; }
        .whatsapp-btn { position: fixed; bottom: 30px; left: 20px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; }
        
        @media (max-width: 576px) { .carousel-item img { height: 300px; } #cartPanel { width: 100%; } }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand">KHUSHAL FABRIC</a>
        <div class="ms-auto">
            <a class="nav-link position-relative" href="javascript:void(0)" onclick="toggleCart()">
                <i class="fa fa-shopping-bag fs-4"></i>
                <span id="cart-count" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="filter-container sticky-top">
    <button class="filter-btn active" onclick="filterBrands('all', this)">All</button>
    <button class="filter-btn" onclick="filterBrands('lawn', this)">Lawn Trouser</button>
    <button class="filter-btn" onclick="filterBrands('mizaj', this)">Mizaj</button>
    <button class="filter-btn" onclick="filterBrands('jacquard', this)">Jacquard</button>
    <button class="filter-btn" onclick="filterBrands('binsaeed', this)">Bin Saeed</button>
    <button class="filter-btn" onclick="filterBrands('alkaram', this)">Alkaram</button>
    <button class="filter-btn" onclick="filterBrands('mtj', this)">MTJ</button>
    <button class="filter-btn" onclick="filterBrands('jdot', this)">J.</button>
    <button class="filter-btn" onclick="filterBrands('saya', this)">Saya</button>
</div>

<div class="container my-5">
    <div class="row g-4" id="brandGrid">
        
        <div class="col-md-6 col-lg-4 brand-item mtj">
            <div class="brand-card">
                <div id="sliderMTJ" class="carousel slide" data-bs-ride="carousel">
                    <a href="mtj-catalog.pdf" target="_blank" class="pdf-link"><i class="fa fa-file-pdf"></i> View PDF</a>
                    <div class="carousel-inner">
                        <div class="carousel-item active"><img src="mtj1.jpg"></div>
                        <div class="carousel-item"><img src="mtj2.jpg"></div>
                        <div class="carousel-item"><img src="mtj3.jpg"></div>
                        </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#sliderMTJ" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                    <button class="carousel-control-next" type="button" data-bs-target="#sliderMTJ" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                </div>
                <div class="card-body">
                    <h5 class="fw-bold">MTJ BY MTJ 3PC</h5>
                    <p class="small text-muted">Digital Printed Lawn Collection</p>
                    <div class="mb-3">
                        <span class="old-price">Rs. 4590</span>
                        <span class="price-tag">Rs. 2350</span>
                    </div>
                    <div class="input-group mb-2">
                        <input type="text" id="color-mtj" class="form-control" placeholder="Enter Color/Design Name">
                        <button class="btn btn-success" onclick="addToCartWithDetails('MTJ 3PC', 2350, 'color-mtj')">Add</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4 brand-item binsaeed">
            <div class="brand-card">
                <div id="sliderBS" class="carousel slide" data-bs-ride="carousel">
                    <a href="binsaeed.pdf" target="_blank" class="pdf-link"><i class="fa fa-file-pdf"></i> View PDF</a>
                    <div class="carousel-inner">
                        <div class="carousel-item active"><img src="bs1.jpg"></div>
                        <div class="carousel-item"><img src="bs2.jpg"></div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#sliderBS" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                    <button class="carousel-control-next" type="button" data-bs-target="#sliderBS" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                </div>
                <div class="card-body">
                    <h5 class="fw-bold">BIN SAEED LUXURY</h5>
                    <p class="small text-muted">Embroidered Luxury Edition</p>
                    <div class="mb-3">
                        <span class="old-price">Rs. 3799</span>
                        <span class="price-tag">Rs. 2600</span>
                    </div>
                    <div class="input-group mb-2">
                        <input type="text" id="color-bs" class="form-control" placeholder="Enter Color/Design Name">
                        <button class="btn btn-success" onclick="addToCartWithDetails('Bin Saeed', 2600, 'color-bs')">Add</button>
                    </div>
                </div>
            </div>
        </div>
        </div>
</div>

<div id="cartPanel">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Your Bag</h4>
        <button class="btn-close" onclick="toggleCart()"></button>
    </div>
    <div id="cartItemsList"></div>
    <hr>
    <div class="d-flex justify-content-between fw-bold fs-5">
        <span>Total:</span>
        <span>Rs. <span id="totalPrice">0</span></span>
    </div>
    <div class="bg-light p-3 rounded mt-4">
        <input type="text" id="custName" class="form-control mb-2" placeholder="Full Name">
        <textarea id="custAddr" class="form-control" placeholder="Address"></textarea>
    </div>
    <button class="btn btn-success w-100 py-3 mt-3 fw-bold" onclick="sendWhatsApp()">ORDER ON WHATSAPP</button>
</div>

<a href="https://wa.me/923490162829" class="whatsapp-btn"><i class="fab fa-whatsapp"></i></a>

<script>
    let cart = [];

    function filterBrands(brand, btn) {
        document.querySelectorAll('.brand-item').forEach(item => {
            item.style.display = (brand === 'all' || item.classList.contains(brand)) ? 'block' : 'none';
        });
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addToCartWithDetails(name, price, inputId) {
        let color = document.getElementById(inputId).value;
        if(!color) { alert("Please enter color name from images/PDF"); return; }
        
        cart.push({ name: name + " (" + color + ")", price: price });
        document.getElementById(inputId).value = '';
        updateCart();
        alert("Added to Bag!");
    }

    function updateCart() {
        const list = document.getElementById('cartItemsList');
        let total = 0;
        list.innerHTML = "";
        cart.forEach((item, index) => {
            total += item.price;
            list.innerHTML += `<div class="d-flex justify-content-between mb-2 border-bottom pb-1">
                <span>${item.name}</span>
                <span>Rs. ${item.price}</span>
            </div>`;
        });
        document.getElementById('totalPrice').innerText = total;
        document.getElementById('cart-count').innerText = cart.length;
    }

    function toggleCart() {
        let cp = document.getElementById('cartPanel');
        cp.style.display = (cp.style.display === 'block') ? 'none' : 'block';
    }

    function sendWhatsApp() {
        let n = document.getElementById('custName').value;
        let a = document.getElementById('custAddr').value;
        if(!n || !a || cart.length === 0) { alert("Complete details first!"); return; }
        
        let msg = `*New Order: Khushal Fabric*%0AName: ${n}%0AAddress: ${a}%0A%0AItems:%0A`;
        cart.forEach(i => msg += `- ${i.name} : Rs.${i.price}%0A`);
        msg += `%0A*Total: Rs. ${document.getElementById('totalPrice').innerText}*`;
        window.open(`https://wa.me/923490162829?text=${msg}`);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
